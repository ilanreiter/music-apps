server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://server:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
        # AI itinerary proposals/imports can take well over the 60s default
        # before Claude finishes generating a long day-by-day plan — a
        # multi-week road trip can legitimately take several minutes.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Hashed build files never change, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The page itself must be re-checked on every load, otherwise the browser can keep showing an older version of the app
    # after a rebuild (new tabs, buttons and fixes would not appear until a manual hard refresh).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
