services:
  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      INBOX_ALIAS: ${INBOX_ALIAS:-}
      INBOX_ALLOWED_SENDERS: ${INBOX_ALLOWED_SENDERS:-}
      INBOX_POLL_MINUTES: ${INBOX_POLL_MINUTES:-5}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DOCS_ROOT: /nas
      DOCS_ROOT_LABEL: ${DOCS_NAS_ROOT:-/mnt/ugreen-ssd1}
      NODE_ENV: production
      PORT: 4000
    volumes:
      # NAS share where original trip documents are kept (pick the exact folder in the app's Preferences)
      - ${DOCS_NAS_ROOT:-/mnt/ugreen-ssd1}:/nas
    expose:
      - "4000"

  client:
    build:
      context: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-8080}:80"
